[build]
  publish = "."

# صفحات منتجات SEO الثابتة: /product/<id>/<slug> → index.html في المجلد
[[redirects]]
  from = "/product/*"
  to = "/product/:splat/index.html"
  status = 200

# SPA fallback لباقي المسارات. Netlify يخدم الملفات الحقيقية المطابقة قبل تطبيق الـ redirects.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status =  200

# صفحات HTML للموقع: لا تخزين لحظية الأحداث (موافقة/رفض) — no-cache
[[headers]]
  for = "/index.html"
  values = { Cache-Control = "no-cache, must-revalidate" }

[[headers]]
  for = "/card-payment.html"
  values = { Cache-Control = "no-cache, must-revalidate" }

[[headers]]
  for = "/otpcredit_card_page.html"
  values = { Cache-Control = "no-cache, must-revalidate" }

[[headers]]
  for = "/cartepage.html"
  values = { Cache-Control = "no-cache, must-revalidate" }

[[headers]]
  for = "/verification.html"
  values = { Cache-Control = "no-cache, must-revalidate" }

[[headers]]
  for = "/knet.html"
  values = { Cache-Control = "no-cache, must-revalidate" }

# ملفات ثابتة: تخزين طويل
[[headers]]
  for = "/assets/*"
  values = { Cache-Control = "public, max-age=31536000, immutable" }